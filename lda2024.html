const area = document.getElementById("examArea");

questions.forEach((q,i)=>{
let html = `<div class="question">
<b>${i+1}. ${q.q}</b>`;

q.o.forEach((op,j)=>{
html += `
<label class="option">
<input type="radio" name="q${i}" value="${j}">
${op}
</label>`;
});

html += `</div>`;
area.innerHTML += html;
});

/* ===== SUBMIT EXAM ===== */

function submitExam(){

let correct = 0;

questions.forEach((q,i)=>{
let sel = document.querySelector(`input[name="q${i}"]:checked`);
if(sel && Number(sel.value) === q.a) correct++;
});

let marks = correct * 2;
let totalMarks = questions.length * 2;
let passMark = totalMarks * 0.4;

let resultText = marks >= passMark
  ? "âœ… PASS"
  : "âŒ FAIL";

document.getElementById("result").innerHTML = `
<h2>Correct Answers: ${correct}/${questions.length}</h2>
<h2>Total Marks: ${marks} / ${totalMarks}</h2>
<h2>${resultText}</h2>
<p>Pass Mark: ${passMark}</p>
`;

window.scrollTo(0, document.body.scrollHeight);

}
